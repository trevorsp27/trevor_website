<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trevor | Bird Photos</title>
    <meta name="description" content="Photo gallery for a Louisiana bird species." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../assets/profile-favicon.png?v=20260526e" />
    <link rel="stylesheet" href="../assets/css/styles.css?v=20260603a" />
    <script src="../assets/js/site-data.js?v=20260602a" defer></script>
    <script src="../assets/js/site.js?v=20260602a" defer></script>
    <script src="../assets/js/bird-gallery.js?v=20260605b" defer></script>
  </head>
  <body data-page="birds">
    <div class="site-shell">
      <header class="site-header reveal">
        <a class="logo" href="/" data-site-name>Trevor's Room</a>
        <nav aria-label="Primary">
          <ul data-nav></ul>
        </nav>
      </header>

      <main>
        <section class="hero reveal" aria-labelledby="bird-title">
          <p class="kicker">Bird Gallery</p>
          <h1 id="bird-title">Bird photos</h1>
          <p><a class="inline-link" href="/pages/birds.html">Back to Birds list</a></p>
        </section>

        <section class="panel reveal" aria-labelledby="photos-title">
          <h2 id="photos-title">Photos</h2>
          <p id="bird-gallery-empty" class="birds-loading" hidden>No photos have been added for this species yet.</p>
          <div id="bird-viewer" class="bird-viewer" hidden>
            <button id="bird-prev" class="bird-nav" type="button" aria-label="Previous photo">&larr;</button>
            <figure class="bird-photo-stage">
              <img
                id="bird-viewer-image"
                src=""
                alt="Bird photo"
                loading="lazy"
                decoding="async"
              />
            </figure>
            <button id="bird-next" class="bird-nav" type="button" aria-label="Next photo">&rarr;</button>
          </div>
          <p id="bird-viewer-count" class="birds-loading" hidden></p>

          <section id="bird-note" class="bird-note" hidden>
            <p id="bird-note-text" class="bird-note-text"></p>
          </section>
        </section>
      </main>

      <footer>
        <p>&copy; <span data-year></span> <span data-owner>Trevor</span>. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
