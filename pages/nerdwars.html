  <body data-page="nerdwars">
    <div class="site-shell">
      <header class="site-header reveal">
        <a class="logo" href="/" data-site-name>Trevor's Room</a>
        <nav aria-label="Primary">
          <ul data-nav></ul>
        </nav>
      </header>

      <main>
        <section class="hero reveal" aria-labelledby="nw-title">
          <p class="kicker">Game</p>
          <h1 id="nw-title">NerdWars</h1>
        </section>

        <section class="nw-panel reveal" aria-labelledby="nw-play-title">
          <h2 id="nw-play-title" class="nw-sr-only">Play</h2>
          <div class="nw-bar">
            <button class="nw-btn" type="button" data-nerdwars-fullscreen>
              Fullscreen
            </button>
            <label class="nw-music" for="nw-music">
              <span class="nw-music-label">Music</span>
              <input id="nw-music" type="range" min="0" max="100" step="5" value="100" />
              <output class="nw-music-val" id="nw-music-val" for="nw-music">100%</output>
            </label>
          </div>
          <div class="nw-stage" data-nerdwars>
            <canvas id="nw-canvas" aria-label="NerdWars game screen"></canvas>
            <div class="nw-veil" aria-hidden="true">
              <span class="nw-veil-key">CLICK TO PLAY</span>
            </div>
          </div>
        </section>

        <!-- The room used to be here: a create button, a code field, a seat
             list and a stage picker, all in HTML underneath the game. It is
             drawn inside the game now, so there is a lobby in fullscreen and
             nobody has to look away from the screen to set up another match.

             net.js still runs the whole of the transport; it just has no DOM
             to write to any more, and every element it looked for is
             optional. What is kept is this one line, because it is the only
             thing on the page a screen reader could follow -- net.js still
             announces "Room ready", "Kel joined", "Lost the connection" into
             it, and a canvas announces nothing. -->
        <p class="nw-sr-only" id="nw-status" role="status" aria-live="polite"></p>

        <section class="panel reveal" aria-labelledby="nw-controls-title">
          <h2 id="nw-controls-title">Controls</h2>
          <div class="nw-keys-wrap">
            <table class="nw-keys">
              <thead>
                <tr>
                  <th scope="col">Move</th>
                  <th scope="col">Jump</th>
                  <th scope="col">Drop</th>
                  <th scope="col">Specials</th>
                  <th scope="col">Ult</th>
                  <th scope="col">Jab</th>
                  <th scope="col">Grab</th>
                  <th scope="col">Shield</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><kbd>A</kbd><kbd>D</kbd></td>
                  <td><kbd>W</kbd> <kbd>Space</kbd></td>
                  <td><kbd>S</kbd></td>
                  <td><kbd>H</kbd><kbd>J</kbd><kbd>K</kbd></td>
                  <td><kbd>L</kbd></td>
                  <td><kbd>G</kbd></td>
                  <td><kbd>Y</kbd></td>
                  <td><kbd>Shift</kbd></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

      </main>

      <script>
        /* The music slider.

           There is one inside the game too, on the controls screen, but that
           is three keystrokes and a screen change away from a match -- which
           is why the person who asked for a music bar could not find it. This
           one sits above the canvas and is always there.

           Deferred scripts have all run by DOMContentLoaded, so NerdWars is
           built by the time this fires. If it is not -- a blocked bundle, a
           browser that refused something -- the control removes itself rather
           than sitting there doing nothing. */
        document.addEventListener("DOMContentLoaded", function () {
          var range = document.getElementById("nw-music");
          var out = document.getElementById("nw-music-val");
          var audio = window.NerdWars && window.NerdWars.audio;
          if (!range || !out) return;
          if (!audio || typeof audio.setMusicVolume !== "function") {
            var label = range.closest(".nw-music");
            if (label) label.hidden = true;
            return;
          }
          var show = function (v) { out.textContent = v <= 0 ? "off" : Math.round(v * 100) + "%"; };
          range.value = String(Math.round(audio.musicVolume * 100));
          show(audio.musicVolume);
          range.addEventListener("input", function () {
            show(audio.setMusicVolume(Number(range.value) / 100));
          });
        });
      </script>

      <footer>
        <p>&copy; <span data-year></span> <span data-owner>Trevor</span>. All rights reserved.</p>
      </footer>
